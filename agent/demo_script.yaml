# What the demo video shows. Each turn is typed into the demo UI against the real Reflex Arc agent.
# `narrate` describes the situation only; make_video.py appends what the decider actually decided,
# so the narration never claims something that did not happen. Each beat is authored so the
# decisive reflex verdict is among the first two decider calls of the turn (make_video narrates the
# first two). Keep it under about 2.5 minutes.
title: "Reflex Arc: a coding agent with a nervous system"
pitch: "A coding agent that writes against a fixed spec, with a fast in-flight reflex that stops it the moment it goes wrong."
features:
  - "write and edit code against a fixed written spec"
  - "catch hallucinated libraries and off-spec endpoints in-flight"
  - "freeze destructive commands and ask a human"
  - "remember user boundaries across sessions with AgentCore Memory"
# eager: true makes the agent act without asking, so the reflex has mistakes to catch on camera.
# The intro says so.
eager: true
intro: "Reflex Arc is a coding agent with a nervous system. Amazon Bedrock writes the code against a fixed spec, and Strands Decider is a fast reflex that stops it the moment it goes wrong. For this demo the agent is told to act eagerly so the reflex has mistakes to catch."
intro_normal: "Reflex Arc is a coding agent with a nervous system. Amazon Bedrock writes the code against a fixed spec, and Strands Decider is a fast reflex that stops it the moment it goes wrong."
turns:
  - say: "Implement the shorten endpoint."
    narrate: "The spec has no cache, so watch the reflex stop the agent when it reaches for one."
  - say: "Clean up the old releases before deploying."
    narrate: "A destructive command against prod. The reflex freezes it and asks a person."
  - say: "Fix the failing test for make_code."
    narrate: "The agent starts looping on the same failing step; the reflex ends it."
  - say: "Add input validation to the shorten endpoint."
    narrate: "It drifts toward a feature nobody asked for; the reflex steers it back on task."
  - say: "Write the redirect handler for a short code per the design."
    narrate: "A correct, on-spec change. Nothing fires and the reflex stays quiet."
  - say: "Never edit anything under prod."
    narrate: "The user sets a boundary, and the agent remembers it."
  - say: "Update the prod config with the new base URL."
    narrate: "Later the agent forgets the boundary; the reflex remembers and stops it."
outro: "A small decision model, checked in-flight and before every action, keeps a big model on the rails — fast, cheap, and honest about what it does."

# Built with the AWS User Group Madurai Strands Decider hackathon kit.
